<div class="categories-container">
  <button mat-raised-button color="warn" (click)="goToDashboard()">Back to Dashboard</button>
  <h2>Categories Management</h2>

  <!-- Create Category Form -->
  <div class="create-form" *ngIf="!isEditing">
    <mat-form-field appearance="outline">
      <mat-label>Category Name</mat-label>
      <input matInput #categoryName placeholder="Enter category name">
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="createCategory(categoryName.value)">
      Create Category
    </button>
  </div>

  <!-- Edit Category Form -->
  <div class="edit-form" *ngIf="isEditing && currentCategory">
    <mat-form-field appearance="outline">
      <mat-label>Category Name</mat-label>
      <input matInput #editName [value]="currentCategory.name" placeholder="Enter category name">
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="updateCategory(currentCategory, editName.value)">
      Update Category
    </button>
    <button mat-button (click)="cancelEdit()">
      Cancel
    </button>
  </div>

  <div class="loading" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
  </div>

  <div class="table-container" *ngIf="!isLoading">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let category"> {{category.id}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let category"> {{category.name}} </td>
      </ng-container>

      <!-- Created At Column -->
      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef> Created At </th>
        <td mat-cell *matCellDef="let category"> {{category.created_at | date:'short'}} </td>
      </ng-container>

      <!-- Updated At Column -->
      <ng-container matColumnDef="updated_at">
        <th mat-header-cell *matHeaderCellDef> Updated At </th>
        <td mat-cell *matCellDef="let category"> {{category.updated_at | date:'short'}} </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let category">
          <button mat-button color="primary" (click)="startEdit(category)">
            Edit
          </button>
          <button mat-button color="warn" (click)="deleteCategory(category)">
            Delete
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
