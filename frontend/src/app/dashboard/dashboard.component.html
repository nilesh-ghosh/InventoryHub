<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>InventoryHub Dashboard</h1>
    <button mat-raised-button color="warn" (click)="logout()">Logout</button>
  </header>

  <div class="dashboard-content">
    <mat-card class="dashboard-card">
      <mat-card-header>
        <mat-card-title>Users</mat-card-title>
        <mat-card-subtitle>Manage system users</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>Create, view, edit, and delete users in the system.</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button routerLink="/users">Manage Users</button>
      </mat-card-actions>
    </mat-card>

    <mat-card class="dashboard-card">
      <mat-card-header>
        <mat-card-title>Categories</mat-card-title>
        <mat-card-subtitle>Manage product categories</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>Organize products into categories.</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button routerLink="/categories">Manage Categories</button>
      </mat-card-actions>
    </mat-card>

    <mat-card class="dashboard-card">
      <mat-card-header>
        <mat-card-title>Products</mat-card-title>
        <mat-card-subtitle>Manage inventory products</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>Add, edit, and track product inventory.</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button routerLink="/products">Manage Products</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
